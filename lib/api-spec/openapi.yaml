        "200":
          description: Filtered travel profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelProfileView"
        "403":
          description: Not a travel companion of this traveler
        "404":
          description: Traveler not found

  /travelers/{userId}/travel-profile/avatar:
    get:
      operationId: getTravelerTravelProfileAvatar
      tags: [traveler]
      summary: Stream a companion's profile photo. Same access check as GET /travelers/{userId}/travel-profile, re-verified on every request
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Avatar binary content
        "403":
          description: Not a travel companion of this traveler
        "404":
          description: Traveler has no avatar

  /agency/travelers/{userId}/tags:
    get:
      operationId: getAgencyTravelerTags
      tags: [traveler]
      summary: Back-office view of a traveler's individual tags (admin/manager/agent/local_guide of an agency that shares a trip with the traveler). Empty unless the traveler gave explicit, separate consent
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Consent flag and tags (tags always empty when consent is false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyTravelerTags"
        "403":
          description: Forbidden -- traveler has no trip with the staff member's agency
        "404":
          description: Not found

  /me/trips/{tripId}/countries:
    get:
      operationId: getMyTripCountries
      tags: [traveler]
      summary: Countries derived from a trip's itinerary that the traveler hasn't classified yet (for the post-create/join modal)
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unclassified countries for this trip
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripCountryCandidate"
        "403":
          description: Not authorized to view this trip

  /checklist-templates:
    get:
      operationId: listChecklistTemplates
      tags: [checklist-templates]
      summary: List the agency's checklist templates
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChecklistTemplate"
    post:
      operationId: createChecklistTemplate
      tags: [checklist-templates]
      summary: Create a checklist template for the agency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistTemplateInput"
      responses:
        "201":
          description: Template created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistTemplate"

  /checklist-templates/{templateId}:
    patch:
      operationId: updateChecklistTemplate
      tags: [checklist-templates]
      summary: Update a checklist template
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistTemplateUpdate"
      responses:
        "200":
          description: Updated template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChecklistTemplate"
    delete:
      operationId: deleteChecklistTemplate
      tags: [checklist-templates]
      summary: Delete a checklist template
      parameters:
        - name: templateId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /me/trips/{tripId}/documents/{documentId}/download:
    get:
      operationId: getTripDocumentDownloadUrl
      tags: [traveler]
      summary: Get a short-lived signed download URL for a trip document
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: documentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Signed download URL
          content:
            application/json:
              schema:
                type: object
                required: [signedUrl]
                properties:
                  signedUrl:
                    type: string
                    description: Short-lived pre-signed URL (15 minutes)
        "403":
          description: Forbidden
        "404":
          description: Document not found

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"

  /storage/objects/{path}:
    get:
      operationId: downloadStorageObject
      tags: [storage]
      summary: Download a private stored object (uploader only)
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private objects namespace
      responses:
        "200":
          description: Object binary content
        "401":
          description: Unauthorized
        "403":
          description: Forbidden — not the uploader
        "404":
          description: Not found

  /me/trips/{tripId}/dismiss:
    delete:
      operationId: dismissTrip
      tags: [traveler]
      summary: Dismiss a cancelled trip from the traveler's view
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Trip dismissed

  /trip-photos/{code}:
    get:
      operationId: getTripPhoto
      tags: [traveler]
      summary: View a shared trip photo (public, no auth — accessed via link/code)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The frozen trip snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripPhotoView"
        "404":
          description: Photo not found

  /trip-photos/{code}/use-as-template:
    post:
      operationId: useTripPhotoAsTemplate
      tags: [traveler]
      summary: Create a brand new, editable personal trip pre-filled from a shared photo's snapshot
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: New trip created from the photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UseTripPhotoTemplateResponse"
        "404":
          description: Photo not found

  # ─── DAY ACTIVITIES ─────────────────────────────────────────────────────────
  /itineraries/suggest-day-description:
    post:
      operationId: suggestDayDescription
      tags: [itineraries]
      summary: Generate an AI-powered day description using agency writing tone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestDayDescriptionInput"
      responses:
        "200":
          description: Generated description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestDayDescriptionResult"

  /itineraries/parse-pdf:
    post:
      operationId: parseItineraryPdf
      tags: [itineraries]
      summary: Parse a PDF/text document to extract itinerary structure via AI
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParsePdfInput"
      responses:
        "200":
          description: Parsed itinerary structure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParsedItinerary"

  /itineraries/{itineraryId}/days/{dayId}/activities:
    get:
      operationId: listDayActivities
      tags: [itineraries]
      summary: List activities linked to an itinerary day
      parameters:
        - name: itineraryId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of day activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DayActivity"
    post:
      operationId: addDayActivity
      tags: [itineraries]
      summary: Link an activity to an itinerary day
      parameters:
        - name: itineraryId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DayActivityInput"
      responses:
        "201":
          description: Activity linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayActivity"

  /itineraries/{itineraryId}/days/{dayId}/activities/{linkId}:
    patch:
      operationId: updateItineraryDayActivity
      tags: [itineraries]
      summary: Update per-link fields for an itinerary day activity
      parameters:
        - name: itineraryId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
        - name: linkId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItineraryDayActivityUpdate"
      responses:
        "200":
          description: Updated activity link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayActivity"
        "404":
          description: Not found
    delete:
      operationId: removeDayActivity
      tags: [itineraries]
      summary: Unlink an activity from an itinerary day
      parameters:
        - name: itineraryId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
        - name: linkId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Unlinked

  # ─── ITINERARY DAY HOTELS ───────────────────────────────────────────────────
  /itineraries/{itineraryId}/days/{dayId}/hotels:
    get:
      operationId: listItineraryDayHotels
      tags: [itineraries]
      summary: List hotel assignments for an itinerary day
      parameters:
        - name: itineraryId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of hotel assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DayHotel"
    post:
      operationId: addItineraryDayHotel
      tags: [itineraries]
      summary: Assign a hotel with a segment to an itinerary day
      parameters:
        - name: itineraryId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DayHotelInput"
      responses:
        "201":
          description: Hotel assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayHotel"

  /itineraries/{itineraryId}/days/{dayId}/hotels/{assignmentId}:
    delete:
      operationId: removeItineraryDayHotel
      tags: [itineraries]
      summary: Remove a hotel assignment from an itinerary day
      parameters:
        - name: itineraryId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  # ─── TRIP DAY HOTELS ────────────────────────────────────────────────────────
  /trips/{tripId}/days/{dayId}/hotels:
    get:
      operationId: listTripDayHotels
      tags: [trips]
      summary: List hotel assignments for a trip day
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of hotel assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DayHotel"
    post:
      operationId: addTripDayHotel
      tags: [trips]
      summary: Assign a hotel with a segment to a trip day
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DayHotelInput"
      responses:
        "201":
          description: Hotel assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DayHotel"

  /trips/{tripId}/days/{dayId}/hotels/{assignmentId}:
    delete:
      operationId: removeTripDayHotel
      tags: [trips]
      summary: Remove a hotel assignment from a trip day
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
        - name: assignmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  # ─── DASHBOARD ───────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Agency dashboard summary — trips by status, occupancy, recent activity
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/itineraries:
    get:
      operationId: getDashboardItineraries
      tags: [dashboard]
      summary: Aggregated itinerary performance across the agency — totals and ranking (Admin/Manager/Agent)
      responses:
        "200":
          description: Aggregated itinerary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardItinerariesSummary"

components:
  schemas:
    HealthStatus:
      type: object
      required: [ok, version]
      properties:
        ok:
          type: boolean
        version:
          type: string

    # ─── AUTH ─────────────────────────────────────────────────────────────────
    AuthUser:
      type: object
      required: [id, email, name, role, status, emailVerified]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, manager, agent, advisor, traveler]
        agencyId:
          type: ["integer", "null"]
        agencyName:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        emailVerified:
          type: boolean

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RegisterInput:
      type: object
      required: [email, password, name, acceptTerms]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        name:
          type: string
        acceptTerms:
          type: boolean

    ForgotPasswordInput:
      type: object
      required: [email]
      properties:
        email:
          type: string

    ResetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8

    # ─── AGENCY ───────────────────────────────────────────────────────────────
    Agency:
      type: object
      required: [id, name, slug, active, createdAt, writingTone, publicProfileEnabled, agencyType, photoUrls]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        logoUrl:
          type: ["string", "null"]
        logoFileUrl:
          type: ["string", "null"]
          description: Uploaded logo file URL, served publicly from R2. Takes priority over logoUrl when present.
        primaryColor:
          type: ["string", "null"]
        writingTone:
          type: string
          enum: [informative, friendly, adventurous, luxury, professional]
        description:
          type: ["string", "null"]
        publicProfileEnabled:
          type: boolean
        agencyType:
          type: string
          enum: [agency, advisor]
          description: Agencia tradicional vs. Asesor de Viajes (tenant unipersonal, #169). Solo clasificación de plataforma, no rige permisos (eso lo hace users.role).
        active:
          type: boolean
        photoUrls:
          type: array
          items:
            type: string
          description: Carrusel de fotos del perfil público, en orden de subida. Se gestiona por separado vía POST/DELETE /agencies/{agencyId}/photos, no por PATCH.
        createdAt:
          type: string

    AgencyInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
        logoUrl:
          type: string
        primaryColor:
          type: string
        writingTone:
          type: string
          enum: [informative, friendly, adventurous, luxury, professional]
        description:
          type: string
        publicProfileEnabled:
          type: boolean
        agencyType:
          type: string
          enum: [agency, advisor]

    AgencyUpdate:
      type: object
      properties:
        name:
          type: string
        logoUrl:
          type: string
        primaryColor:
          type: string
        writingTone:
          type: string
          enum: [informative, friendly, adventurous, luxury, professional]
        active:
          type: boolean
        description:
          type: ["string", "null"]
        publicProfileEnabled:
          type: boolean
        agencyType:
          type: string
          enum: [agency, advisor]

    # ─── USER ─────────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, email, name, role, active, status, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, manager, agent, advisor, traveler]
        agencyId:
          type: ["integer", "null"]
        # Solo poblado para role=traveler (#178): agencias con las que el viajero ha viajado
        # (viaje con invitación/share aceptada), derivado de trip_shares. No es el mismo
        # concepto que agencyId (personal de agencia), es una relación histórica.
        agencyIds:
          type: array
          items:
            type: integer
        active:
          type: boolean
        status:
          type: string
          enum: [pending, approved, rejected]
        createdAt:
          type: string

    UserInput:
      type: object
      required: [email, name, role]
      properties:
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, manager, agent, advisor, traveler]
        password:
          type: string
        agencyId:
          type: ["integer", "null"]

    UserUpdate:
      type: object
      properties:
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [admin, manager, agent, advisor, traveler]
        agencyId:
          type: ["integer", "null"]
        active:
          type: boolean
        status:
          type: string
          enum: [approved, rejected]
          description: Approve or reject a pending registration. Setting this also invalidates the user's approval-email token.
        password:
          type: string

    # ─── ITINERARY ────────────────────────────────────────────────────────────
    AgencyInquiryInput:
      type: object
      required: [agencyId, message]
      properties:
        agencyId:
          type: integer
        itineraryId:
          type: integer
        message:
          type: string

    AgencyInquiryStatus:
      type: string
      enum: [pending, read]

    AgencyInquiry:
      type: object
      required: [id, agencyId, travelerId, message, status, createdAt]
      properties:
        id:
          type: integer
        agencyId:
          type: integer
        itineraryId:
          type: ["integer", "null"]
        travelerId:
          type: integer
        message:
          type: string
        status:
          $ref: "#/components/schemas/AgencyInquiryStatus"
        createdAt:
          type: string

    AgencyInquirySent:
      type: object
      required: [id, agencyId, agencyName, message, status, createdAt]
      properties:
        id:
          type: integer
        agencyId:
          type: integer
        agencyName:
          type: string
        itineraryId:
          type: ["integer", "null"]
        itineraryName:
          type: ["string", "null"]
        message:
          type: string
        status:
          $ref: "#/components/schemas/AgencyInquiryStatus"
        createdAt:
          type: string

    AgencyInquiryReceived:
      type: object
      required: [id, travelerName, travelerEmail, message, status, createdAt]
      properties:
        id:
          type: integer
        itineraryId:
          type: ["integer", "null"]
        itineraryName:
          type: ["string", "null"]
        travelerName:
          type: string
        travelerEmail:
          type: string
        message:
          type: string
        status:
          $ref: "#/components/schemas/AgencyInquiryStatus"
        createdAt:
          type: string

    TripType:
      type: string
      enum: [adventure, beach, cultural, culinary, nature, city, wellness, family]

    PublicAgencySummary:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        logoUrl:
          type: ["string", "null"]

    PublicAgencyItinerarySummary:
      type: object
      required: [id, name, numDays, countries, tripTypes]
      properties:
        id:
          type: integer
        name:
          type: string
        numDays:
          type: integer
        countries:
          type: array
          items:
            type: string
        region:
          type: ["string", "null"]
        tripTypes:
          type: array
          items:
            $ref: "#/components/schemas/TripType"
        priceFrom:
          type: ["integer", "null"]
        coverPhotoUrl:
          type: ["string", "null"]

    PublicAgencyProfile:
      type: object
      required: [id, name, slug, itineraries, photoUrls]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        primaryColor:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        photoUrls:
          type: array
          items:
            type: string
        itineraries:
          type: array
          items:
            $ref: "#/components/schemas/PublicAgencyItinerarySummary"

    PublicItinerarySearchResult:
      type: object
      required: [id, name, numDays, countries, tripTypes, agency]
      properties:
        id:
          type: integer
        name:
          type: string
        numDays:
          type: integer
        countries:
          type: array
          items:
            type: string
        region:
          type: ["string", "null"]
        tripTypes:
          type: array
          items:
            $ref: "#/components/schemas/TripType"
        priceFrom:
          type: ["integer", "null"]
        coverPhotoUrl:
          type: ["string", "null"]
        agency:
          $ref: "#/components/schemas/PublicAgencySummary"

    PublicItineraryDayHotel:
      type: object
      required: [hotelName]
      properties:
        hotelName:
          type: string
        hotelCity:
          type: ["string", "null"]
        hotelAddress:
          type: ["string", "null"]
        segment:
          type: ["string", "null"]

    PublicItineraryDayActivity:
      type: object
      required: [activityName]
      properties:
        activityName:
          type: string
        activityCategory:
          type: ["string", "null"]
        startTime:
          type: ["string", "null"]
        timeOfDay:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    PublicItineraryDay:
      type: object
      required: [id, dayNumber, isTransitNight, hotels, activities]
      properties:
        id:
          type: integer
        dayNumber:
          type: integer
        cityFrom:
          type: ["string", "null"]
        cityTo:
          type: ["string", "null"]
        transport:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        isTransitNight:
