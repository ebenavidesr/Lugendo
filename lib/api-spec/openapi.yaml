openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Lugendo — Travel agency management platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: agencies
    description: Agency management (Admin)
  - name: users
    description: User management
  - name: itineraries
    description: Itinerary templates
  - name: hotels
    description: Hotel catalog
  - name: trips
    description: Trip instances
  - name: invitations
    description: Traveler invitations
  - name: traveler
    description: Traveler front desk
  - name: activities
    description: Activity catalog
  - name: dashboard
    description: Dashboard aggregates
  - name: destinations
    description: Destination description generation
  - name: storage
    description: Object storage upload and serving endpoints
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Server not ready (migrations pending)

  # ─── DESTINATIONS ───────────────────────────────────────────────────────────
  /destinations/describe:
    post:
      operationId: describeDestination
      tags: [destinations]
      summary: Generate an AI-powered destination description using web search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestinationDescribeInput"
      responses:
        "200":
          description: Generated description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationDescribeResult"

  # ─── SEARCH (public, no auth) ─────────────────────────────────────────────────
  /search/itineraries:
    get:
      operationId: searchItineraries
      tags: [search]
      summary: Search itineraries published by agencies in the public catalog (no session required)
      parameters:
        - name: destination
          in: query
          schema:
            type: string
        - name: tripTypes
          in: query
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: "#/components/schemas/TripType"
        - name: maxBudget
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Published itineraries matching the filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicItinerarySearchResult"

  /search/itineraries/{itineraryId}:
    get:
      operationId: getPublicItinerary
      tags: [search]
      summary: Get the public detail of a published itinerary (no session required), with days/hotels/activities
      parameters:
        - name: itineraryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Public itinerary detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicItineraryDetail"
        "404":
          description: Not found or not published

  /agencies/public/{slug}:
    get:
      operationId: getPublicAgencyProfile
      tags: [search]
      summary: Get an agency's public profile by slug (no session required); 404 unless the agency opted in
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public agency profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicAgencyProfile"
        "404":
          description: Not found or not published

  # ─── AGENCY INQUIRIES (tarea #163) ─────────────────────────────────────────────
  /agency-inquiries:
    post:
      operationId: createAgencyInquiry
      tags: [agency-inquiries]
      summary: Send an inquiry to an agency (requires a session)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencyInquiryInput"
      responses:
        "201":
          description: Inquiry created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyInquiry"
        "400":
          description: Validation error
        "401":
          description: Unauthorized
        "404":
          description: Agency not found
    get:
      operationId: listAgencyInquiries
      tags: [agency-inquiries]
      summary: List inquiries received by the caller's agency (Admin/Manager)
      responses:
        "200":
          description: Inquiries for the caller's agency
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgencyInquiryReceived"

  /agency-inquiries/me:
    get:
      operationId: listMyAgencyInquiries
      tags: [agency-inquiries]
      summary: List inquiries sent by the current user
      responses:
        "200":
          description: Inquiries sent by the caller
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgencyInquirySent"

  /agency-inquiries/{inquiryId}/read:
    patch:
      operationId: markAgencyInquiryRead
      tags: [agency-inquiries]
      summary: Mark an inquiry as read (Admin/Manager, own agency only)
      parameters:
        - name: inquiryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated inquiry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgencyInquiry"
        "404":
          description: Not found

  # ─── AUTH ───────────────────────────────────────────────────────────────────
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Unauthorized

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new traveler account (optionally with invite code)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Validation error

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "204":
          description: Logged out

  /auth/resend-verification:
    post:
      operationId: resendVerificationEmail
      tags: [auth]
      summary: Resend the email verification link to the current session's user
      responses:
        "204":
          description: Verification email sent (or account already verified, no-op)
        "401":
          description: Unauthorized

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset email. Always responds 204 regardless of whether the email exists, to avoid leaking account existence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "204":
          description: Reset email sent if the account exists

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using a token from the forgot-password email. Invalidates all other active sessions for the user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "204":
          description: Password reset
        "400":
          description: Invalid or expired token

  # ─── AGENCIES ───────────────────────────────────────────────────────────────
  /agencies:
    get:
      operationId: listAgencies
      tags: [agencies]
      summary: List all agencies (Admin only)
      responses:
        "200":
          description: List of agencies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agency"
    post:
      operationId: createAgency
      tags: [agencies]
      summary: Create a new agency (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencyInput"
      responses:
        "201":
          description: Agency created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agency"

  /agencies/{agencyId}:
    get:
      operationId: getAgency
      tags: [agencies]
      summary: Get agency by ID
      parameters:
        - name: agencyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agency detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agency"
        "404":
          description: Not found
    patch:
      operationId: updateAgency
      tags: [agencies]
      summary: Update agency
      parameters:
        - name: agencyId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgencyUpdate"
      responses:
        "200":
          description: Updated agency
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agency"
    delete:
      operationId: deleteAgency
      tags: [agencies]
      summary: Delete agency or advisor (Admin only) — rejected if it has any linked itineraries, trips, users, hotels or activities
      parameters:
        - name: agencyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: Cannot delete — agency has linked data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAgencyConflict"

  /agencies/{agencyId}/logo:
    post:
      operationId: uploadAgencyLogo
      tags: [agencies]
      summary: Upload a logo file for an agency (PNG/JPG/SVG/WebP, max 2MB). Uploaded directly via fetch/FormData on the client, not through the generated hook's body.
      parameters:
        - name: agencyId
          in: path
          required: true
          schema:
            type: integer
      # No requestBody schema: uploaded via raw fetch()/FormData on the client (same convention
      # as every other file transfer in this API), not through the generated hook's body. A
      # `format: binary` field here would make orval emit a File/Blob-typed zod schema, which
      # fails to compile in lib/api-zod (no DOM lib).
      responses:
        "200":
          description: Agency updated with the new logo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agency"
        "400":
          description: Invalid file (format not allowed or over 2MB)
        "404":
          description: Not found
    delete:
      operationId: deleteAgencyLogo
      tags: [agencies]
      summary: Remove an agency's uploaded logo file (falls back to logoUrl if set)
      parameters:
        - name: agencyId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agency updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agency"
        "404":
          description: Not found

  /agencies/{agencyId}/photos:
    post:
      operationId: uploadAgencyPhoto
      tags: [agencies]
      summary: Upload a photo to an agency's public-profile gallery (PNG/JPG/WebP, max 5MB), appended to photoUrls. Uploaded directly via fetch/FormData on the client, not through the generated hook's body.
      parameters:
        - name: agencyId
          in: path
          required: true
          schema:
            type: integer
      # No requestBody schema: uploaded via raw fetch()/FormData on the client, same convention as
      # POST /agencies/{agencyId}/logo.
      responses:
        "200":
          description: Agency updated with the new photo appended to photoUrls
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agency"
        "400":
          description: Invalid file (format not allowed or over 5MB)
        "404":
          description: Not found

  /agencies/{agencyId}/photos/{index}:
    delete:
      operationId: deleteAgencyPhoto
      tags: [agencies]
      summary: Remove a photo from an agency's gallery by its position in photoUrls
      parameters:
        - name: agencyId
          in: path
          required: true
          schema:
            type: integer
        - name: index
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Agency updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agency"
        "404":
          description: Not found

  # ─── USERS ──────────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (scoped to agency for Manager/Agent)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create agency user (Admin/Manager)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ─── ITINERARIES ─────────────────────────────────────────────────────────────
  /itineraries:
    get:
      operationId: listItineraries
      tags: [itineraries]
      summary: List itineraries for the agency
      responses:
        "200":
          description: List of itineraries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Itinerary"
    post:
      operationId: createItinerary
      tags: [itineraries]
      summary: Create itinerary template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItineraryInput"
      responses:
        "201":
          description: Itinerary created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Itinerary"

  /itineraries/{itineraryId}:
    get:
      operationId: getItinerary
      tags: [itineraries]
      summary: Get itinerary detail with days
      parameters:
        - name: itineraryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Itinerary detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryDetail"
        "404":
          description: Not found
    patch:
      operationId: updateItinerary
      tags: [itineraries]
      summary: Update itinerary
      parameters:
        - name: itineraryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItineraryUpdate"
      responses:
        "200":
          description: Updated itinerary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Itinerary"
    delete:
      operationId: deleteItinerary
      tags: [itineraries]
      summary: Delete itinerary (Admin/Manager/Agent) — rejected if trips are linked; use PATCH active=false to deactivate instead
      parameters:
        - name: itineraryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "409":
          description: Cannot delete — itinerary has linked trips; deactivate it instead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteItineraryConflict"

  /itineraries/{itineraryId}/stats:
    get:
      operationId: getItineraryStats
      tags: [itineraries]
      summary: Itinerary KPIs (trips, travelers, revenue) and the list of linked trips (Admin/Manager/Agent)
      parameters:
        - name: itineraryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Itinerary statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryStats"

  /itineraries/{itineraryId}/days:
    get:
      operationId: listItineraryDays
      tags: [itineraries]
      summary: List days for an itinerary
      parameters:
        - name: itineraryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of days
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ItineraryDay"
    post:
      operationId: createItineraryDay
      tags: [itineraries]
      summary: Add a day to an itinerary
      parameters:
        - name: itineraryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItineraryDayInput"
      responses:
        "201":
          description: Day created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryDay"

  /itineraries/{itineraryId}/days/{dayId}:
    patch:
      operationId: updateItineraryDay
      tags: [itineraries]
      summary: Update an itinerary day
      parameters:
        - name: itineraryId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItineraryDayUpdate"
      responses:
        "200":
          description: Updated day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ItineraryDay"
    delete:
      operationId: deleteItineraryDay
      tags: [itineraries]
      summary: Delete an itinerary day
      parameters:
        - name: itineraryId
          in: path
          required: true
          schema:
            type: integer
        - name: dayId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── HOTELS ─────────────────────────────────────────────────────────────────
  /hotels:
    get:
      operationId: listHotels
      tags: [hotels]
      summary: List hotels in the agency catalog
      responses:
        "200":
          description: List of hotels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Hotel"
    post:
      operationId: createHotel
      tags: [hotels]
      summary: Add hotel to agency catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HotelInput"
      responses:
        "201":
          description: Hotel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"

  /hotels/{hotelId}:
    get:
      operationId: getHotel
      tags: [hotels]
      summary: Get hotel detail
      parameters:
        - name: hotelId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Hotel detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"
        "404":
          description: Not found
    patch:
      operationId: updateHotel
      tags: [hotels]
      summary: Update hotel
      parameters:
        - name: hotelId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HotelUpdate"
      responses:
        "200":
          description: Updated hotel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hotel"

  # ─── ACTIVITIES ─────────────────────────────────────────────────────────────
  /activities:
    get:
      operationId: listActivities
      tags: [activities]
      summary: List activities in the agency catalog
      responses:
        "200":
          description: List of activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
    post:
      operationId: createActivity
      tags: [activities]
      summary: Add activity to agency catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityInput"
      responses:
        "201":
          description: Activity created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"

  /activities/{activityId}:
    get:
      operationId: getActivity
      tags: [activities]
      summary: Get activity detail
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Activity detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "404":
          description: Not found
    patch:
      operationId: updateActivity
      tags: [activities]
      summary: Update activity
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivityUpdate"
      responses:
        "200":
          description: Updated activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
    delete:
      operationId: deleteActivity
      tags: [activities]
      summary: Delete activity
      parameters:
        - name: activityId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── TRIPS ──────────────────────────────────────────────────────────────────
  /trips:
    get:
      operationId: listTrips
      tags: [trips]
      summary: List trips for the agency
      responses:
        "200":
          description: List of trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trip"
    post:
      operationId: createTrip
      tags: [trips]
      summary: Create a trip from an itinerary or from scratch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripInput"
      responses:
        "201":
          description: Trip created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"

  /trips/{tripId}:
    get:
      operationId: getTrip
      tags: [trips]
      summary: Get trip detail with days and invitations
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trip detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripDetail"
        "404":
          description: Not found
    patch:
      operationId: updateTrip
      tags: [trips]
      summary: Update trip
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripUpdate"
      responses:
        "200":
          description: Updated trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trip"
    delete:
