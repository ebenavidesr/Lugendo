        totalTravelers:
          type: integer
        avgTravelersPerTrip:
          type: number
        totalRevenue:
          type: number
        avgRevenuePerTrip:
          type: number
        topByRevenue:
          type: array
          items:
            $ref: "#/components/schemas/ItineraryRankingEntry"
        topByTravelers:
          type: array
          items:
            $ref: "#/components/schemas/ItineraryRankingEntry"

