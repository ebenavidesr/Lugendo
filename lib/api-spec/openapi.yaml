          description: When true, also flags the resource "shared with all" so travelers who join the trip afterwards are auto-included, not just current members.

    # ─── DASHBOARD ───────────────────────────────────────────────────────────
    DashboardSummary:
      type: object
      required: [tripsByStatus, totalTravelers, upcomingTrips, recentInvitations]
      properties:
        tripsByStatus:
          type: object
          required: [draft, scheduled, active, finished, cancelled]
          properties:
            draft:
              type: integer
            scheduled:
              type: integer
            active:
              type: integer
            finished:
              type: integer
            cancelled:
              type: integer
        totalTravelers:
          type: integer
        upcomingTrips:
          type: array
          items:
            $ref: "#/components/schemas/Trip"
        recentInvitations:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
        occupancyAlerts:
          type: array
          items:
            $ref: "#/components/schemas/Trip"

    ItineraryRankingEntry:
      type: object
      required: [id, name, tripCount, travelerCount, revenue]
      properties:
        id:
          type: integer
        name:
          type: string
        tripCount:
          type: integer
        travelerCount:
          type: integer
        revenue:
          type: number
          description: "Estimación hasta que exista un dato de facturación real (#92): fee de plataforma (10€/viajero) para admin, o viajeros × precio desde del itinerario para agencia/asesor"

    DashboardItinerariesSummary:
      type: object
      required: [totalItineraries, activeItineraries, tripCount, totalTravelers, avgTravelersPerTrip, totalRevenue, avgRevenuePerTrip, topByRevenue, topByTravelers]
