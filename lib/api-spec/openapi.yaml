        title:
          type: string
        description:
          type: ["string", "null"]
        type:
          type: ["string", "null"]
          enum: [Visita, Traslado, Libre, Gastronomía, Vuelo, Actividad, null]
        moment:
          type: ["string", "null"]
          enum: [mañana, tarde, noche, null]

    ParsedDay:
      type: object
      required: [dayNumber]
      properties:
        dayNumber:
          type: integer
        title:
          type: ["string", "null"]
          description: "Full day title, possibly multi-locality (not truncated)"
        localities:
          type: array
          items:
            type: string
        cityFrom:
          type: ["string", "null"]
        cityTo:
          type: ["string", "null"]
        transport:
          $ref: "#/components/schemas/TransportMode"
        description:
          type: ["string", "null"]
        meals:
          type: ["string", "null"]
          description: "Normalized meal plan for the day (e.g. 'Desayuno y cena')"
        hotel:
          oneOf:
            - $ref: "#/components/schemas/ParsedHotel"
            - type: "null"
        parsedActivities:
          type: array
          items:
            $ref: "#/components/schemas/ParsedActivity"
        dayNotes:
          type: array
          items:
            type: string
        activities:
          type: array
          items:
            type: string
        hotels:
          type: array
          items:
            type: string

    DayActivity:
      type: object
      required: [id, dayId, activityName, sortOrder, included, canEdit, createdAt]
      properties:
        id:
          type: integer
        dayId:
          type: integer
        activityId:
          type: ["integer", "null"]
        activityName:
          type: string
        activityCategory:
          type: ["string", "null"]
        sortOrder:
          type: integer
        startTime:
          type: ["string", "null"]
        endTime:
          type: ["string", "null"]
        timeOfDay:
          type: ["string", "null"]
          enum: [mañana, tarde, noche, null]
        address:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
          description: Descripción del catálogo de actividades (#159).
        durationHours:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]
        companyContact:
          type: ["string", "null"]
        addressOverride:
          type: ["string", "null"]
        included:
          type: boolean
        transportMode:
          $ref: "#/components/schemas/TransportMode"
        canEdit:
          type: boolean
        createdAt:
          type: string
        costAmount:
          type: ["number", "null"]
          description: Coste por persona. Solo se muestra/edita en actividades por libre (#151).
        costCurrency:
          type: ["string", "null"]
          description: ISO 4217. Fijo a EUR por ahora.
        createdByName:
          type: ["string", "null"]
          description: Nombre de quien creó la actividad. Usado para el badge "Por libre · nombre" en el back office.
        isMine:
          type: boolean
          description: Solo presente en la vista de viajero -- creador o participante de esta actividad por libre.
        participants:
          type: array
          items:
            $ref: "#/components/schemas/ActivityParticipant"
        sharedWithAll:
          type: boolean
          description: When true, travelers who join the trip afterwards are auto-added as participants too, not just current members. Only meaningful for por-libre activities; only present for the activity's creator.
        warning:
          type: string
          description: Aviso blando no bloqueante (p. ej. colisión de horario con una actividad incluida).

    ActivityParticipant:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
        name:
          type: string

    DayActivityInput:
      type: object
      properties:
        activityId:
          type: integer
        activityTitle:
          type: string
        sortOrder:
          type: integer
        startTime:
          type: string
        endTime:
          type: string
        timeOfDay:
          type: string
          enum: [mañana, tarde, noche]
        notes:
          type: string
        companyContact:
          type: string
        addressOverride:
          type: string
        included:
          type: boolean
        transportMode:
          $ref: "#/components/schemas/TransportMode"
        costAmount:
          type: number
        participantIds:
          type: array
          items:
            type: integer

    ItineraryDayActivityUpdate:
      type: object
      properties:
        dayId:
          type: integer
        startTime:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    TripDayActivityUpdate:
      type: object
      properties:
        dayId:
          type: integer
        startTime:
          type: ["string", "null"]
        endTime:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        companyContact:
          type: ["string", "null"]
        addressOverride:
          type: ["string", "null"]
        included:
